name: Build Pearl Rig Control installer

on:
  push:
    branches: [main, fix/native-windows-window, 'codex/**']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate Pearl application icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(64, 64)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $bg = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 11, 15, 23))
          $g.FillEllipse($bg, 2, 2, 60, 60)
          $ring = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255, 0, 229, 192), 4)
          $g.DrawEllipse($ring, 6, 6, 52, 52)
          $pearl = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 52, 211, 153))
          $g.FillEllipse($pearl, 20, 20, 24, 24)
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHIcon())
          $fs = New-Object System.IO.FileStream('pearl-icon.ico', [System.IO.FileMode]::Create)
          try { $icon.Save($fs) } finally { $fs.Dispose(); $icon.Dispose(); $g.Dispose(); $bmp.Dispose(); $bg.Dispose(); $ring.Dispose(); $pearl.Dispose() }

      - name: Download and verify official OneZeroMiner
        shell: pwsh
        run: |
          $archive = 'onezerominer-win64-1.8.3.zip'
          $url = 'https://github.com/OneZeroMiner/onezerominer/releases/download/v1.8.3/onezerominer-win64-1.8.3.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = 'bdbd0faf6144237bf4d975e4160f83c9ed8f00d291270f4fa42e037de220f209'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "OneZeroMiner SHA256 mismatch: $actual" }
          $expanded = Join-Path $PWD 'miner-expanded'
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $package = Join-Path $expanded 'onezerominer-win64-1.8.3'
          if (-not (Test-Path (Join-Path $package 'onezerominer.exe') -PathType Leaf)) { throw 'Official OneZeroMiner executable was not found in the archive' }
          New-Item -ItemType Directory -Path 'miner' -Force | Out-Null
          Copy-Item -Path (Join-Path $package '*') -Destination 'miner' -Recurse -Force

      - name: Download and verify Microsoft Visual C++ Runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile 'vc_redist.x64.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath 'vc_redist.x64.exe'
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'The Visual C++ runtime download does not have a valid Microsoft signature.' }

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and publish WPF application
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'src/wpf/PearlRigCore.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:GITHUB_EVENT_NAME -eq 'release') { $version = $env:GITHUB_REF_NAME -replace '^[vV]', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid application version: $version" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PEARL_APP_VERSION=$version"
          dotnet restore 'src/wpf/PearlRigCore.csproj' --runtime win-x64 --source 'https://api.nuget.org/v3/index.json'
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed with exit code $LASTEXITCODE" }
          dotnet publish 'src/wpf/PearlRigCore.csproj' --configuration Release --runtime win-x64 --self-contained true --no-restore "-p:Version=$version" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false --output 'publish/win-x64'
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'publish/win-x64/PearlRigControl.exe' -PathType Leaf)) { throw 'Published WPF executable was not created' }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed to install Inno Setup (exit code $LASTEXITCODE)" }
          }
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "ISCC.exe was not found at $iscc" }

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $required = @('installer.iss', 'publish/win-x64/PearlRigControl.exe', 'rig-config.json', 'pearl-icon.ico', 'miner/onezerominer.exe')
          foreach ($path in $required) { if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Required installer input is missing: $path" } }
          New-Item -ItemType Directory -Path 'Output' -Force | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$env:PEARL_APP_VERSION" (Join-Path $env:GITHUB_WORKSPACE 'installer.iss')
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath 'Output/PearlRigControl-Setup.exe' -PathType Leaf)) { throw 'Installer EXE was not created' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PearlRigControl-Setup
          path: Output/PearlRigControl-Setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Output/PearlRigControl-Setup.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
