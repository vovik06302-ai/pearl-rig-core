name: Build Pearl Rig Control installer

on:
  push:
    branches: [main, fix/native-windows-window]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare PowerShell payload
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath 'pearl_watchdog_agent.bat' -Raw -Encoding UTF8
          $marker = ':: ___PS_' + 'START___'
          $index = $source.IndexOf($marker)
          if ($index -lt 0) { throw 'Embedded PowerShell payload marker was not found' }
          $payload = $source.Substring($index + $marker.Length).TrimStart()
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($payload, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.ToString() }; throw 'PowerShell payload syntax is invalid' }
          $bom = [Text.UTF8Encoding]::new($true)
          [IO.File]::WriteAllText('pearl_watchdog_agent.bat', $source, $bom)

      - name: Generate Pearl desktop icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(64, 64)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $bgBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 11, 15, 23))
          $g.FillEllipse($bgBrush, 2, 2, 60, 60)
          $ringPen = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255, 16, 185, 129), 4)
          $g.DrawEllipse($ringPen, 6, 6, 52, 52)
          $pearlBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 52, 211, 153))
          $g.FillEllipse($pearlBrush, 20, 20, 24, 24)
          $g.Dispose()
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHIcon())
          $fs = New-Object System.IO.FileStream('pearl-icon.ico', [System.IO.FileMode]::Create)
          $icon.Save($fs)
          $fs.Close()
          $bmp.Dispose()

      - name: Download and verify official OneZeroMiner
        shell: pwsh
        run: |
          $archive = 'onezerominer-win64-1.8.3.zip'
          $url = 'https://github.com/OneZeroMiner/onezerominer/releases/download/v1.8.3/onezerominer-win64-1.8.3.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = 'bdbd0faf6144237bf4d975e4160f83c9ed8f00d291270f4fa42e037de220f209'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "OneZeroMiner SHA256 mismatch: $actual" }
          $stage = Join-Path $PWD 'miner'
          $expanded = Join-Path $PWD 'miner-expanded'
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $package = Join-Path $expanded 'onezerominer-win64-1.8.3'
          if (-not (Test-Path (Join-Path $package 'onezerominer.exe'))) { throw 'Official OneZeroMiner executable was not found in the archive' }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path (Join-Path $package '*') -Destination $stage -Recurse -Force
          if (-not (Test-Path (Join-Path $stage 'onezerominer.exe'))) { throw 'OneZeroMiner staging failed' }

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y }
          & $iscc 'installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'Output/PearlRigControl-Setup.exe')) { throw 'Installer EXE was not created' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PearlRigControl-Setup
          path: Output/PearlRigControl-Setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Output/PearlRigControl-Setup.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
